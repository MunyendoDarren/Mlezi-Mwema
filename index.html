<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Mlezi Salama | Children's Online Safety</title>
<meta name="description" content="Bilingual (Swahili/English) parent's guide to children's online safety.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <strong class="brand">Mlezi Salama</strong>
    <div class="lang" role="group" aria-label="Language / Lugha">
      <button data-lang="en" aria-pressed="true">English</button>
      <button data-lang="sw" aria-pressed="false">Kiswahili</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1 id="title"></h1>
    <p id="tagline" class="lead"></p>
    <p id="privacy" class="note"></p>
  </section>

  <section aria-labelledby="h-signs"><h2 id="h-signs"></h2><p id="signs-intro"></p><ul id="signs" class="list"></ul></section>
  <section aria-labelledby="h-apps"><h2 id="h-apps"></h2><div id="apps" class="grid"></div></section>
  <section aria-labelledby="h-controls"><h2 id="h-controls"></h2><div id="controls" class="grid"></div></section>
  <section aria-labelledby="h-check"><h2 id="h-check"></h2><p id="progress" aria-live="polite"></p><ul id="checklist" class="checks"></ul></section>
  <section aria-labelledby="h-act"><h2 id="h-act"></h2><ol id="act" class="steps"></ol></section>
  <section aria-labelledby="h-help"><h2 id="h-help"></h2><ul id="help" class="list"></ul></section>
</main>

<footer class="wrap foot"><p id="disclaimer"></p></footer>
<script src="js/content.js"></script>
<script src="js/app.js"></script>
</body>
</html>
